<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C100E">
<title>Awtybots 5829 — app shell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root {
  --bg: #0C100E;
  --bg-2: #111613;
  --card: #151B18;
  --card-2: #1B231F;
  --line: rgba(255, 255, 255, 0.07);
  --line-2: rgba(255, 255, 255, 0.12);
  --text: #EEF0EC;
  --text-2: #A4ABA6;
  --text-3: #8D948F;
  --gold: #F4C542;
  --gold-ink: #1A1404;
  --gold-soft: rgba(244, 197, 66, 0.15);
  --green: #2BB673;
  --green-hi: #5FD69B;
  --green-deep: #0F3324;
  --green-soft: rgba(43, 182, 115, 0.17);
  --warn: #FF9466;
  --warn-soft: rgba(255, 122, 69, 0.15);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-back: cubic-bezier(0.34, 1.56, 0.64, 1);
  --display: 'Space Grotesk', system-ui, sans-serif;
  --body: 'Inter', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: #070908;
  color: var(--text);
  font-family: var(--body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ---------- stage (desktop) ---------- */
.stage {
  min-height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 72px;
  padding: 40px;
}
.side { width: 300px; display: flex; flex-direction: column; gap: 28px; }
.side .kicker { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; color: var(--gold); }
.side h1 { margin: 8px 0 0; font-family: var(--display); font-weight: 700; font-size: 44px; line-height: 0.95; letter-spacing: -0.035em; }
.side p { margin: 0; color: var(--text-2); font-size: 15px; line-height: 1.55; }
.side .label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; color: var(--text-3); margin-bottom: 10px; }
.jump { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.jump button {
  min-height: 44px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--bg-2);
  font-size: 14px; font-weight: 500; transition: border-color .25s var(--ease), background .25s var(--ease);
}
.jump button:hover { border-color: var(--gold); }
.jump button[aria-pressed="true"] { border-color: var(--gold); background: var(--gold-soft); color: var(--gold); }
.switch { display: flex; align-items: center; gap: 12px; min-height: 44px; background: none; border: none; padding: 0; font-size: 14px; font-weight: 500; }
.switch .track { width: 44px; height: 26px; border-radius: 13px; background: var(--line-2); position: relative; transition: background .25s var(--ease); }
.switch .knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--text); transition: transform .35s var(--ease-back); }
.switch[aria-checked="true"] .track { background: var(--green); }
.switch[aria-checked="true"] .knob { transform: translateX(18px); }
.swatches { display: flex; gap: 10px; align-items: center; color: var(--text-3); font-size: 13px; }
.swatches i { width: 18px; height: 18px; border-radius: 50%; display: inline-block; }

.phone {
  width: 390px; height: min(844px, calc(100vh - 60px)); flex: none;
  border-radius: 48px;
  background: var(--bg);
  border: 1px solid var(--line-2);
  box-shadow: 0 0 0 10px #151816, 0 40px 120px rgba(0,0,0,0.55);
  overflow: hidden;
  position: relative;
  display: flex; flex-direction: column;
}
#app { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }

@media (max-width: 900px) {
  .side { display: none; }
  .stage { padding: 0; display: block; }
  .phone { width: 100%; height: 100dvh; border-radius: 0; border: none; box-shadow: none; }
}

/* ---------- motion ---------- */
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { 0% { transform: scale(0.96); } 100% { transform: scale(1); } }
[data-anim="1"] .r { animation: rise .6s var(--ease) both; animation-delay: calc(var(--i, 0) * 55ms); }
[data-anim="1"] .ghost { animation: fade 1.2s var(--ease) both; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- login ---------- */
.login { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 76px 24px 34px; position: relative; overflow: hidden; }
.ghost {
  position: absolute; right: -36px; top: 40px;
  font-family: var(--display); font-weight: 700; font-size: 210px; line-height: 0.8; letter-spacing: -0.06em;
  color: transparent; -webkit-text-stroke: 1px rgba(43, 182, 115, 0.22);
  pointer-events: none; user-select: none;
}
.brand { display: flex; flex-direction: column; gap: 22px; position: relative; }
.mark {
  width: 64px; height: 64px; border-radius: 18px; background: var(--green-deep);
  border: 1px solid rgba(43, 182, 115, 0.45);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-weight: 600; font-size: 17px; color: var(--gold); letter-spacing: -0.02em;
}
.wordmark { margin: 0; font-family: var(--display); font-weight: 700; font-size: 50px; line-height: 0.92; letter-spacing: -0.04em; }
.wordmark span { color: var(--gold); }
.tagline { margin: 10px 0 0; font-size: 16px; line-height: 1.45; color: var(--text-2); max-width: 280px; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; color: var(--text-3); text-transform: uppercase; }
.roles { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.role {
  display: flex; align-items: center; gap: 14px; min-height: 66px; padding: 12px 16px; border-radius: 16px;
  border: 1.5px solid var(--line-2); background: var(--bg-2); text-align: left;
  transition: border-color .3s var(--ease), background .3s var(--ease), transform .2s var(--ease);
}
.role:active { transform: scale(0.985); }
.role .rt { flex: 1; display: flex; flex-direction: column; gap: 3px; }
.role .rn { font-size: 17px; font-weight: 600; }
.role .rd { font-size: 13px; color: var(--text-2); }
.radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-2); display: flex; align-items: center; justify-content: center; transition: border-color .3s var(--ease); }
.radio i { width: 10px; height: 10px; border-radius: 50%; background: var(--gold); transform: scale(0); transition: transform .35s var(--ease-back); }
.role[aria-checked="true"] { border-color: var(--gold); background: rgba(244, 197, 66, 0.07); }
.role[aria-checked="true"] .radio { border-color: var(--gold); }
.role[aria-checked="true"] .radio i { transform: scale(1); }
.signin { display: flex; flex-direction: column; gap: 12px; }
.btn {
  height: 56px; border-radius: 16px; border: none; font-size: 16px; font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: transform .2s var(--ease), filter .2s var(--ease), background .3s var(--ease);
}
.btn:active { transform: scale(0.98); }
.btn-light { background: #F1F3EF; color: #101411; }
.btn-gold { background: var(--gold); color: var(--gold-ink); }
.btn-gold:hover, .btn-light:hover { filter: brightness(1.05); }
.btn-dark { background: var(--gold-ink); color: var(--gold); }
.btn-outline { background: transparent; color: var(--text); border: 1.5px solid var(--line-2); }
.hint { margin: 0; font-size: 13px; line-height: 1.45; color: var(--text-3); text-align: center; }

/* ---------- app ---------- */
.top { padding: 58px 20px 14px; display: flex; align-items: flex-end; gap: 12px; }
@media (max-width: 900px) { .top { padding-top: calc(env(safe-area-inset-top) + 22px); } }
.top .tl { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.top .meta-row { display: flex; align-items: center; gap: 8px; }
.date { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; color: var(--text-3); }
.event-chip { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.1em; padding: 3px 7px; border-radius: 6px; background: var(--green-soft); color: var(--green-hi); }
.title { margin: 0; font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1; letter-spacing: -0.035em; }
.me { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; padding: 0; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--green-deep); border: 1px solid rgba(43, 182, 115, 0.4); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: var(--text); }
.me .chip { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; color: var(--gold); }

main { flex: 1; overflow-y: auto; padding: 6px 20px 28px; display: flex; flex-direction: column; gap: 26px; scrollbar-width: none; }
main::-webkit-scrollbar { display: none; }

.hero { border-radius: 24px; background: var(--card); border: 1px solid var(--line); padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.hero.green { background: var(--green-deep); border-color: rgba(43, 182, 115, 0.35); }
.hero .k { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; color: var(--text-3); }
.hero .k.gold { color: var(--gold); }
.hero .k.green { color: var(--green-hi); }
.hero .h { font-family: var(--display); font-weight: 600; font-size: 24px; letter-spacing: -0.02em; }
.hero .sub { font-family: var(--mono); font-size: 14px; color: var(--text-2); }
.hero .big { font-family: var(--display); font-weight: 700; font-size: 58px; line-height: 0.88; letter-spacing: -0.045em; }
.hero .big.gold { color: var(--gold); }
.hero .note { font-size: 13px; color: var(--text-3); text-align: center; }
.hero .note.ok { color: var(--green-hi); display: flex; align-items: center; justify-content: center; gap: 8px; }
.hero .note.ok::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px var(--green-soft); }
.stack { display: flex; flex-direction: column; gap: 6px; }
.baseline { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,0.08); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; background: var(--gold); transform-origin: left; }
[data-anim="1"] .bar i { animation: grow 1s var(--ease) .25s both; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.subteams { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.subteams div { border-radius: 12px; background: rgba(255,255,255,0.05); padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.subteams b { font-family: var(--mono); font-size: 18px; font-weight: 600; }
.subteams span { font-size: 11px; color: var(--text-2); }

.group { display: flex; flex-direction: column; gap: 10px; }
.group h2 { margin: 0; font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.12em; color: var(--text-3); text-transform: uppercase; }
.list { border-radius: 18px; background: var(--card); border: 1px solid var(--line); overflow: hidden; }
.row {
  width: 100%; min-height: 62px; display: flex; align-items: center; gap: 12px; padding: 12px 16px;
  background: none; border: none; text-align: left; transition: background .2s var(--ease);
}
.row + .row { border-top: 1px solid rgba(255,255,255,0.055); }
.row:hover { background: var(--card-2); }
.row:active { background: var(--card-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #3F4642; flex: none; }
.txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.ttl { font-size: 15px; font-weight: 500; }
.mt { font-size: 13px; color: var(--text-2); }
.badge { flex: none; font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 5px 9px; border-radius: 8px; background: rgba(255,255,255,0.08); color: #C9CEC9; }
.chev { flex: none; color: #5F6662; }
.t-gold.dot { background: var(--gold); } .t-gold.badge { background: var(--gold-soft); color: var(--gold); }
.t-green.dot { background: var(--green); } .t-green.badge { background: var(--green-soft); color: var(--green-hi); }
.t-warn.dot { background: var(--warn); } .t-warn.badge { background: var(--warn-soft); color: var(--warn); }

.tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; padding: 8px 8px 26px; background: var(--bg-2); border-top: 1px solid var(--line); }
@media (max-width: 900px) { .tabs { padding-bottom: calc(env(safe-area-inset-bottom) + 10px); } }
.tab { min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: none; border: none; color: var(--text-3); font-size: 11px; font-weight: 500; padding: 4px 0; transition: color .25s var(--ease); }
.tab .pill { width: 54px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; transition: background .3s var(--ease); }
.tab[aria-current="page"] { color: var(--gold); font-weight: 600; }
.tab[aria-current="page"] .pill { background: var(--gold-soft); animation: pop .35s var(--ease-back); }
.tab:hover { color: var(--text); }
.tab[aria-current="page"]:hover { color: var(--gold); }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="stage">
  <aside class="side" aria-label="Prototype controls">
    <div>

      <h1>Awtybots<br>team app</h1>

    ],
    homeComp: [

      { label: 'Pick list', items: [['Alliance selection draft', 'Shared with drive team', 'Draft', 'gold']] }
    ],
    tasks: { title: 'Tasks', action: 'New task', sections: [
      { label: 'Overdue', items: [['Bumper fabric order', 'Business · 3 days late', 'Overdue', 'warn']] },
      { label: 'By subteam', items: [['Mechanical', '12 open · 4 in progress', '', ''], ['Programming', '7 open · 3 in progress', '', ''], ['Electrical', '4 open · 2 in progress', '', ''], ['Business', '5 open · 1 in progress', '', '']] }
    ] },
    comp: { title: 'Competition', action: 'Open pick list', sections: [

const state = { signedIn: false, picked: 'student', role: 'student', tab: 'home', checkedIn: false, comp: false };
const app = document.getElementById('app');

function heroHTML(role, comp, i) {
  const s = `style="--i:${i}"`;
  if (role === 'student' && !comp) {
    const c = state.checkedIn;
    return `<section class="hero r" ${s}>
      <div class="stack"><span class="k">TODAY</span><span class="h">Build meeting</span><span class="sub">3:30 – 6:30 PM · Shop</span></div>
      <button type="button" class="btn ${c ? 'btn-outline' : 'btn-gold'}" data-action="check">${c ? 'Check out' : 'Check in'}</button>
      ${c ? '<span class="note ok">Checked in at 3:34 PM · 9.5 h this week</span>' : '<span class="note">Or scan the QR code on the shop kiosk</span>'}
    </section>`;
  }
  if (role === 'student' && comp) {
    return `<section class="hero green r" ${s}>
      <span class="k gold">YOUR NEXT SHIFT · IN 14 MIN</span>
      <div class="baseline"><span class="big gold">Red 2</span><span class="sub" style="color:var(--text)">Q12 – Q18</span></div>
      <button type="button" class="btn btn-gold">Start scouting</button>
      <span class="note ok">Saves on this phone first · 0 waiting to sync</span>
    </section>`;
  }
  if (role === 'parent' && !comp) {
    return `<section class="hero r" ${s}>
      <span class="k">SAM THIS SEASON</span>
      <div class="baseline"><span class="big">42.5<span style="font-size:28px;letter-spacing:-0.02em"> h</span></span><span style="font-size:14px;color:var(--text-2)">of 60 h goal</span></div>
      <div class="bar"><i style="width:71%"></i></div>
      <span class="note ok" style="justify-content:flex-start">Checked in today at 3:34 PM</span>
    </section>`;
  }
  if (role === 'parent' && comp) {
    return `<section class="hero green r" ${s}>
      <span class="k gold">LIVE · WEEK 0 SCRIMMAGE</span>
      <div class="stack"><span class="big" style="font-size:36px;line-height:1">Qual 14 in 18 min</span><span style="font-size:14px;color:var(--text-2)">Red alliance · 5829 with 1234 and 4567</span></div>
      <button type="button" class="btn btn-gold">Watch the stream</button>
    </section>`;
  }
  if (role === 'mentor' && !comp) {
    return `<section class="hero r" ${s}>
      <span class="k">IN THE SHOP NOW</span>
      <div class="baseline"><span class="big">18</span><span class="sub">/ 34 members</span></div>
      <div class="subteams"><div><b>7</b><span>Mech</span></div><div><b>4</b><span>Prog</span></div><div><b>3</b><span>Elec</span></div><div><b>4</b><span>Biz</span></div></div>
    </section>`;
  }
  return `<section class="hero green r" ${s}>
    <span class="k gold">STRATEGY · QUAL 14 IN 18 MIN</span>
    <div class="stack"><span class="big" style="font-size:32px;line-height:1.05">Pre-match brief is ready</span><span style="font-size:14px;color:var(--text-2)">Built from 6 scouts' data on all 6 robots</span></div>
    <button type="button" class="btn btn-gold">Open brief</button>
  </section>`;
}

function rowHTML([title, meta, badge, tone]) {
  const t = tone ? ` t-${tone}` : '';
  return `<button type="button" class="row">
    <span class="dot${t}"></span>
    <span class="txt"><span class="ttl">${title}</span>${meta ? `<span class="mt">${meta}</span>` : ''}</span>
    ${badge ? `<span class="badge${t}">${badge}</span>` : ''}
    <span class="chev">${icon('chev', 16)}</span>
  </button>`;
}

function sectionsHTML(list, start) {
  return list.map((sec, n) => `<section class="group r" style="--i:${start + n}">
    <h2>${sec.label}</h2>
    <div class="list">${sec.items.map(rowHTML).join('')}</div>
  </section>`).join('');
}

function loginHTML() {
  const pick = ROLES.find(r => r.id === state.picked);
  return `<div class="login">
    <div class="ghost" aria-hidden="true">5829</div>
    <div class="brand">
      <div class="mark r" style="--i:0">5829</div>
      <div class="r" style="--i:1">
        <h1 class="wordmark">Awtybots<span>.</span></h1>
        <p class="tagline">Hours, tasks, scouting and the shop, in one place.</p>
      </div>
    </div>
    <div class="r" style="--i:2" role="radiogroup" aria-label="I'm a">
      <div class="eyebrow">I'm a</div>
      <div class="roles">
        ${ROLES.map(r => `<button type="button" class="role" role="radio" aria-checked="${r.id === state.picked}" data-action="pick" data-role="${r.id}">
          <span class="rt"><span class="rn">${r.name}</span><span class="rd">${r.desc}</span></span>
          <span class="radio"><i></i></span>
        </button>`).join('')}
      </div>
    </div>
    <div class="signin r" style="--i:3">
      <button type="button" class="btn btn-light" data-action="signin">${icon('enter', 20)} Continue with Google</button>
      <p class="hint">${pick.hint}</p>
    </div>
  </div>`;
}

function appHTML() {
  const { role, tab, comp } = state;
  const D = DATA[role];
  const p = PEOPLE[role];
  const isHome = tab === 'home';
  const screen = isHome ? null : D[tab];
  let body = '';
  let i = 0;
  if (isHome) {
    body += heroHTML(role, comp, i++);
    body += sectionsHTML(comp ? D.homeComp : D.home, i);
  } else {
    if (screen.action) body += `<button type="button" class="btn btn-gold r" style="--i:${i++}">${icon('plus', 18)} ${screen.action}</button>`;
    body += sectionsHTML(screen.sections, i);
  }
  return `<header class="top">
      <div class="tl">
        <div class="meta-row"><span class="date">${comp ? 'SAT · FEB 21' : 'TUE · NOV 24'}</span>${comp ? '<span class="event-chip">EVENT MODE</span>' : ''}</div>
        <h1 class="title">${isHome ? p.greet : screen.title}</h1>
      </div>
      <button type="button" class="me" data-action="signout" aria-label="Switch role">
        <span class="avatar">${p.initials}</span><span class="chip">${p.chip}</span>
      </button>
    </header>
    <main>${body}</main>
    <nav class="tabs" aria-label="Main">
      ${TABS[role].map(([id, label]) => `<button type="button" class="tab" data-action="tab" data-tab="${id}"${id === tab ? ' aria-current="page"' : ''}>
        <span class="pill">${icon(id)}</span>${label}
      </button>`).join('')}
    </nav>`;
}

function render(animate = true) {
  app.dataset.anim = animate ? '1' : '0';
  app.innerHTML = state.signedIn ? appHTML() : loginHTML();
  if (animate) { app.style.animation = 'none'; void app.offsetHeight; app.style.animation = ''; }
  document.querySelectorAll('#jump button').forEach(b => {
    const r = b.dataset.role;
    b.setAttribute('aria-pressed', String(r === 'login' ? !state.signedIn : state.signedIn && state.role === r));
  });
  const sw = document.getElementById('compSwitch');
  sw.setAttribute('aria-checked', String(state.comp));
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  if (a === 'pick') { state.picked = el.dataset.role; render(false); }
  else if (a === 'signin') { state.role = state.picked; state.signedIn = true; state.tab = 'home'; render(); }
  else if (a === 'signout') { state.signedIn = false; state.picked = state.role; render(); }
  else if (a === 'tab') { if (state.tab !== el.dataset.tab) { state.tab = el.dataset.tab; render(); app.querySelector('main').scrollTop = 0; } }
  else if (a === 'check') { state.checkedIn = !state.checkedIn; render(false); }
  else if (a === 'comp') { state.comp = !state.comp; render(); }
  else if (a === 'jump') {
    const r = el.dataset.role;
    if (r === 'login') { state.signedIn = false; }
    else { state.role = r; state.picked = r; state.signedIn = true; state.tab = 'home'; }
    render();
  }
});

render();
</script>
</body>
</html>
